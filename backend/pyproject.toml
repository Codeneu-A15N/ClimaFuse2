[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climafuse-backend"
version = "0.1.0"
description = "ClimaFuse BMA Weather Forecasting Backend (ECMWF AIFS + NOAA GFS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ClimaFuse Engineering" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "xarray>=2024.6.0",
    "netCDF4>=1.7.0",
    "herbie-data>=2024.8.0",
    "imdlib>=0.1.20",
    "cfgrib>=0.9.14",
    "eccodes>=1.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
